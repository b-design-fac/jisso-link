<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10110f">
  <meta name="description" content="制作時間と工程をリアルタイムで見せるJISSO.LIVEの無料実況ボード。">
  <title>JISSO.LIVE BOARD｜制作実況ボード</title>
  <link rel="icon" href="../../assets/jisso-icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="../../" class="brand">JISSO<span>.</span></a>
    <div class="live-mark"><i></i>JISSO.LIVE / 001</div>
  </header>

  <main>
    <aside class="controls" id="controls">
      <div class="control-head"><p>CONTROL PANEL</p><button id="collapse" aria-label="操作パネルを閉じる">×</button></div>
      <label>今日作るもの<input id="title" value="30分でWebツールを完成させる"></label>
      <div class="row">
        <label>制限時間<select id="limit"><option value="15">15分</option><option value="30" selected>30分</option><option value="45">45分</option><option value="60">60分</option><option value="90">90分</option></select></label>
        <label>LIVE番号<input id="number" type="number" min="1" value="1"></label>
      </div>
      <p class="control-label">工程</p>
      <div class="step-inputs">
        <input id="step1" value="DESIGN / 設計">
        <input id="step2" value="BUILD / 実装">
        <input id="step3" value="CHECK / 確認">
        <input id="step4" value="PUBLIC / 公開">
      </div>
      <div class="timer-buttons">
        <button id="start" class="primary">START</button>
        <button id="pause">PAUSE</button>
        <button id="reset">RESET</button>
      </div>
      <p class="control-label">現在の工程を進める</p>
      <div class="progress-buttons" id="progressButtons"></div>
      <button id="complete" class="complete">COMPLETED.</button>
      <div class="secondary-actions">
        <button id="fullscreen">全画面表示</button>
        <button id="download">完成カード保存</button>
      </div>
    </aside>

    <section class="board" id="board">
      <button class="open-controls" id="openControls">CONTROLS ＋</button>
      <div class="board-top">
        <div class="logo"><i></i>JISSO.LIVE</div>
        <div class="board-status"><span id="statusDot"></span><b id="status">READY</b></div>
      </div>
      <div class="board-body">
        <div class="build-copy">
          <p>TODAY I BUILD</p>
          <h1 id="displayTitle">30分でWebツールを完成させる</h1>
          <div class="current"><small>CURRENT</small><strong id="current">READY TO BUILD</strong></div>
        </div>
        <div class="clock-area">
          <p>BUILD TIME</p>
          <strong id="clock">00:00:00</strong>
          <span id="remaining">LIMIT 30 MIN</span>
        </div>
      </div>
      <div class="timeline" id="timeline"></div>
      <div class="board-foot">
        <span id="liveNumber">JISSO.LIVE / 001</span>
        <span class="line"></span>
        <span id="date"></span>
      </div>
      <div class="completed-overlay" id="completedOverlay">
        <small>STATUS</small>
        <strong>COMPLETED.</strong>
        <p id="completedTitle"></p>
        <button id="closeComplete">結果を見る</button>
      </div>
    </section>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
